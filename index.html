<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f5">
  <title>Dashboard Sekolah & Perpustakaan</title>
  <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/a/AVvXsEiHvgXgNoGTc_c8ZfAeQr2N2QoT4zMIoX3aGn3aeJK-AJC6G_fOl7JUia9w0510lJMhJmDVoPzvBTFqrJMaEPQMiQ1oGEwH0FJ_dOVDHh7AT0zB2lNjPgV7IzGsKZ5Mbn0Y3UmzzGBJWmz-wL5hxiFG99cRZ1c2n5VOHEMiBvc6Atv7DoUNiRmFmG6INbih=s400">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#20312b',
            forest: '#176b52',
            mint: '#e5f2ec',
            canvas: '#f4f7f5'
          }
        }
      }
    };
  </script>
  <style>
    :root { color-scheme: light; }
    body { background: #f7f8f7; color: #26342d; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    [x-cloak] { display: none !important; }
    .status-hadir { background: #e3f4e9; color: #176b3b; border-color: #b9dfc5; }
    .status-izin { background: #e7f1fb; color: #245e91; border-color: #c8dcef; }
    .status-sakit { background: #fff2d9; color: #8a570a; border-color: #f2dcaa; }
    .status-alpa { background: #fde8e7; color: #a13f3b; border-color: #f1c7c4; }
  </style>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen antialiased flex flex-col">
  <div x-data="dashboardApp()" x-init="init()" x-cloak class="min-h-screen flex flex-col">
    <!-- Header & Navbar -->
    <header class="fixed inset-x-0 top-0 z-50 border-b border-[#105a44] bg-forest">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
        <div class="flex items-center gap-3">
          <img src="https://blogger.googleusercontent.com/img/a/AVvXsEiHvgXgNoGTc_c8ZfAeQr2N2QoT4zMIoX3aGn3aeJK-AJC6G_fOl7JUia9w0510lJMhJmDVoPzvBTFqrJMaEPQMiQ1oGEwH0FJ_dOVDHh7AT0zB2lNjPgV7IzGsKZ5Mbn0Y3UmzzGBJWmz-wL5hxiFG99cRZ1c2n5VOHEMiBvc6Atv7DoUNiRmFmG6INbih=s400" alt="Logo" class="h-10 w-10 object-contain">
          <div>
            <p class="font-bold text-white text-sm sm:text-base" x-text="schoolName || 'Dashboard Sekolah'"></p>
            <p class="text-xs text-white/80">Sistem Informasi Akademik & Perpustakaan</p>
          </div>
        </div>
        <!-- Tab Navigation -->
        <nav class="flex gap-2 bg-white/10 p-1 rounded-lg">
          <button @click="currentTab = 'absensi'" :class="currentTab === 'absensi' ? 'bg-white text-forest font-bold shadow' : 'text-white hover:bg-white/10'" class="px-4 py-2 rounded-md text-xs sm:text-sm transition">1. Absensi</button>
          <button @click="currentTab = 'buku'" :class="currentTab === 'buku' ? 'bg-white text-forest font-bold shadow' : 'text-white hover:bg-white/10'" class="px-4 py-2 rounded-md text-xs sm:text-sm transition">2. Daftar Buku</button>
        </nav>
      </div>
    </header>
    <div class="h-16" aria-hidden="true"></div>

    <!-- Main Content -->
    <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-6 sm:px-6 lg:px-8">
      
      <!-- TAB 1: ABSENSI -->
      <div x-show="currentTab === 'absensi'" class="space-y-6">
        <!-- Filter Card -->
        <section class="rounded-xl border border-[#e1e9e3] bg-white p-4 sm:p-5 shadow-sm">
          <h2 class="text-sm font-bold text-ink mb-4">Pengaturan Absensi</h2>
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
            <label class="block">
              <span class="mb-1 block text-xs font-semibold text-[#637269]">Tahun Ajaran</span>
              <select x-model="selectedYear" @change="changeYear()" class="w-full rounded-lg border border-[#dce5df] bg-white p-2.5 text-sm font-semibold text-ink outline-none focus:border-forest" :disabled="!years.length">
                <template x-for="year in years" :key="year"><option :value="year" x-text="year.replace('_', '/')"></option></template>
              </select>
            </label>
            <label class="block">
              <span class="mb-1 block text-xs font-semibold text-[#637269]">Tanggal</span>
              <input type="date" x-model="selectedDate" @change="loadSavedAttendance()" class="w-full rounded-lg border border-[#dce5df] bg-white p-2 text-sm font-semibold text-ink outline-none focus:border-forest">
            </label>
            <label class="block">
              <span class="mb-1 block text-xs font-semibold text-[#637269]">Kelas</span>
              <select x-model="selectedClass" @change="loadStudents()" class="w-full rounded-lg border border-[#dce5df] bg-white p-2.5 text-sm font-semibold text-ink outline-none focus:border-forest">
                <option value="" disabled>Pilih Kelas</option>
                <template x-for="c in classes" :key="c"><option :value="c" x-text="c"></option></template>
              </select>
            </label>
            <label class="block">
              <span class="mb-1 block text-xs font-semibold text-[#637269]">Role</span>
              <select x-model="selectedRole" @change="loadSavedAttendance()" class="w-full rounded-lg border border-[#dce5df] bg-white p-2.5 text-sm font-semibold text-ink outline-none focus:border-forest">
                <template x-for="role in roles" :key="role"><option :value="role" x-text="role"></option></template>
              </select>
            </label>
          </div>
        </section>

        <!-- Student List Card -->
        <section class="rounded-xl border border-[#e1e9e3] bg-white shadow-sm overflow-hidden">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-[#e8eeea] px-5 py-4 gap-3">
            <div>
              <h2 class="text-sm font-bold text-ink">Daftar Peserta Didik</h2>
              <p class="text-xs text-[#7b8981]" x-text="`${students.length} siswa · ${selectedClass || 'Pilih kelas'}`"></p>
            </div>
            <input type="search" x-model="searchQuery" placeholder="Cari nama / NISN..." class="h-10 rounded-lg border border-[#dce5df] bg-white px-3 text-sm outline-none focus:border-forest sm:w-64">
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-[#f8faf8] text-[11px] font-bold uppercase tracking-wider text-[#849189]">
                  <th class="px-5 py-3 w-16">No</th>
                  <th class="px-4 py-3 w-32">NISN</th>
                  <th class="px-4 py-3">Nama Siswa</th>
                  <th class="px-5 py-3 w-48">Status Kehadiran</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[#edf1ee]">
                <template x-if="loading">
                  <tr><td colspan="4" class="text-center py-8 text-sm text-[#7b8981]">Memuat siswa...</td></tr>
                </template>
                <template x-if="!loading && filteredStudents.length === 0">
                  <tr><td colspan="4" class="text-center py-8 text-sm text-[#7b8981]">Belum ada siswa / kelas belum dipilih.</td></tr>
                </template>
                <template x-for="student in filteredStudents" :key="student.nisn">
                  <tr class="hover:bg-[#fbfcfb]">
                    <td class="px-5 py-3 text-sm font-semibold text-[#75837b]" x-text="student.nomorAbsen"></td>
                    <td class="px-4 py-3 font-mono text-xs text-[#75837b]" x-text="student.nisn"></td>
                    <td class="px-4 py-3 text-sm font-semibold text-ink" x-text="student.nama"></td>
                    <td class="px-5 py-2">
                      <select x-model="student.status" class="w-full rounded-lg border px-3 py-1.5 text-xs font-bold outline-none" :class="{
                        'status-hadir': student.status === 'Hadir',
                        'status-izin': student.status === 'Izin',
                        'status-sakit': student.status === 'Sakit',
                        'status-alpa': student.status === 'Alpa'
                      }">
                        <option value="Hadir">Hadir</option>
                        <option value="Izin">Izin</option>
                        <option value="Sakit">Sakit</option>
                        <option value="Alpa">Alpa</option>
                      </select>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <div class="flex items-center justify-between border-t border-[#e8eeea] px-5 py-4 bg-[#f8faf8]">
            <p class="text-xs font-semibold text-ink" x-text="`${markedCount} dari ${students.length} siswa ditandai`"></p>
            <button @click="saveAttendance()" :disabled="saving || !students.length" class="inline-flex items-center gap-2 rounded-lg bg-forest px-5 py-2.5 text-sm font-bold text-white shadow hover:bg-[#105a44] disabled:opacity-50">
              <span x-text="saving ? 'Menyimpan...' : 'Simpan Absensi'"></span>
            </button>
          </div>
        </section>
      </div>

      <!-- TAB 2: BUKU (PENGGERAK TEXTBOOKS) -->
      <div x-show="currentTab === 'buku'" class="space-y-6" x-cloak>
        <section class="rounded-xl border border-[#e1e9e3] bg-white p-4 sm:p-5 shadow-sm space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-base font-bold text-ink">Katalog Buku Kurikulum Penggerak</h2>
              <p class="text-xs text-[#7b8981]">Sumber data: api.buku.cloudapp.web.id</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <input type="search" x-model="bookSearch" placeholder="Cari judul / penulis / subjek..." class="h-10 rounded-lg border border-[#dce5df] bg-white px-3 text-sm outline-none focus:border-forest sm:w-72">
              <select x-model="selectedLevel" class="h-10 rounded-lg border border-[#dce5df] bg-white px-3 text-sm outline-none focus:border-forest">
                <option value="">Semua Jenjang</option>
                <template x-for="lvl in bookLevels" :key="lvl"><option :value="lvl" x-text="lvl"></option></template>
              </select>
            </div>
          </div>
        </section>

        <!-- Book Grid -->
        <div x-show="booksLoading" class="text-center py-12 text-sm text-[#7b8981]">Memuat katalog buku...</div>
        <div x-show="!booksLoading && filteredBooks.length === 0" class="text-center py-12 text-sm text-[#7b8981]">Tidak ada buku ditemukan.</div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" x-show="!booksLoading">
          <template x-for="book in filteredBooks" :key="book.id">
            <article class="bg-white rounded-xl border border-[#e1e9e3] p-4 flex flex-col justify-between shadow-sm hover:shadow transition">
              <div>
                <div class="flex gap-3 mb-3">
                  <img :src="book.image || 'https://via.placeholder.com/100x140?text=No+Cover'" alt="Cover" class="w-20 h-28 object-cover rounded border bg-gray-100 shrink-0">
                  <div class="min-w-0 flex-1">
                    <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-mint text-forest mb-1" x-text="book.level || 'Umum'"></span>
                    <h3 class="font-bold text-sm text-ink line-clamp-2" x-text="book.title"></h3>
                    <p class="text-xs text-[#7b8981] mt-1 line-clamp-1" x-text="`Penulis: ${book.writer || '-'}`"></p>
                    <p class="text-xs text-[#7b8981] line-clamp-1" x-text="`Penerbit: ${book.publisher || '-'}`"></p>
                  </div>
                </div>
                <div class="text-[11px] text-[#637269] space-y-0.5 mb-4">
                  <p><span class="font-semibold">Kelas:</span> <span x-text="book.class || '-'"></span> | <span class="font-semibold">Kategori:</span> <span x-text="book.book_type || '-'"></span></p>
                  <p><span class="font-semibold">ISBN:</span> <span x-text="book.isbn || '-'"></span></p>
                </div>
              </div>
              <div class="pt-3 border-t border-[#edf1ee] flex items-center justify-between">
                <span class="text-[10px] font-semibold text-[#849189]" x-text="book.subject ? book.subject.toUpperCase() : ''"></span>
                <template x-if="book.attachment">
                  <a :href="book.attachment" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-forest text-xs font-bold text-white hover:bg-[#105a44] transition">
                    Baca / Unduh PDF
                  </a>
                </template>
              </div>
            </article>
          </template>
        </div>
      </div>

    </main>
  </div>

  <script>
    const FIREBASE_BASE = 'https://absensi-siswa2026-default-rtdb.asia-southeast1.firebasedatabase.app';
    const SCHOOL_ID = '20205428';

    function dashboardApp() {
      return {
        currentTab: 'absensi',
        schoolName: '',
        years: [],
        classes: [],
        roles: ['Siswa'],
        students: [],
        selectedYear: '',
        selectedDate: '',
        selectedClass: '',
        selectedRole: 'Siswa',
        searchQuery: '',
        loading: false,
        saving: false,

        // Buku state
        books: [],
        booksLoading: false,
        bookSearch: '',
        selectedLevel: '',

        async init() {
          this.selectedDate = new Date().toISOString().slice(0, 10);
          await this.loadSchoolInfo();
          await this.loadYears();
          if (this.years.length) {
            this.selectedYear = this.years[0];
            await this.loadClasses();
          }
          await this.loadBooks();
        },

        async request(path) {
          const res = await fetch(`${FIREBASE_BASE}/${path}.json`);
          return await res.json();
        },

        async loadSchoolInfo() {
          try {
            const data = await this.request(`sekolah/${SCHOOL_ID}/info`);
            if (data && data.nama_sekolah) this.schoolName = data.nama_sekolah;
            if (data && data.roles) {
              this.roles = Array.isArray(data.roles) ? data.roles : Object.values(data.roles);
            }
          } catch(e) {}
        },

        async loadYears() {
          try {
            const data = await this.request(`sekolah/${SCHOOL_ID}/tahun_ajaran`);
            if (data) {
              this.years = Object.keys(data).sort().reverse();
            }
          } catch(e) {}
        },

        async loadClasses() {
          if (!this.selectedYear) return;
          try {
            const data = await this.request(`sekolah/${SCHOOL_ID}/tahun_ajaran/${this.selectedYear}/kelas`);
            if (data) {
              this.classes = Object.keys(data).sort();
              if (this.classes.length && !this.selectedClass) {
                this.selectedClass = this.classes[0];
                await this.loadStudents();
              }
            }
          } catch(e) {}
        },

        async changeYear() {
          this.selectedClass = '';
          this.students = [];
          await this.loadClasses();
        },

        async loadStudents() {
          if (!this.selectedYear || !this.selectedClass) return;
          this.loading = true;
          try {
            const data = await this.request(`sekolah/${SCHOOL_ID}/tahun_ajaran/${this.selectedYear}/kelas/${this.selectedClass}/siswa`);
            this.students = Object.entries(data || {}).map(([nisn, s]) => ({
              nisn,
              nama: s.nama || s.nama_siswa || 'Tanpa Nama',
              nomorAbsen: s.nomor_absen ?? s.no_absen ?? '-',
              status: 'Hadir'
            })).sort((a,b) => (Number(a.nomorAbsen) || 0) - (Number(b.nomorAbsen) || 0));
            await this.loadSavedAttendance();
          } catch(e) {
            this.students = [];
          } finally {
            this.loading = false;
          }
        },

        async loadSavedAttendance() {
          if (!this.selectedYear || !this.selectedClass || !this.selectedDate) return;
          const roleKey = (this.selectedRole || 'siswa').toLowerCase().replace(/\s+/g, '_');
          try {
            const data = await this.request(`sekolah/${SCHOOL_ID}/absensi/${this.selectedYear}/${this.selectedDate}/${this.selectedClass}/${roleKey}/siswa`);
            if (data) {
              this.students = this.students.map(s => ({
                ...s,
                status: data[s.nisn]?.status || 'Hadir'
              }));
            }
          } catch(e) {}
        },

        get filteredStudents() {
          const q = this.searchQuery.toLowerCase();
          if (!q) return this.students;
          return this.students.filter(s => s.nama.toLowerCase().includes(q) || s.nisn.includes(q));
        },

        get markedCount() {
          return this.students.filter(s => s.status).length;
        },

        async saveAttendance() {
          if (!this.students.length || !this.selectedClass) return;
          this.saving = true;
          const roleKey = (this.selectedRole || 'siswa').toLowerCase().replace(/\s+/g, '_');
          const payload = {
            tahun_ajaran: this.selectedYear,
            tanggal: this.selectedDate,
            kelas: this.selectedClass,
            role: this.selectedRole,
            diperbarui_pada: new Date().toISOString(),
            siswa: Object.fromEntries(this.students.map(s => [s.nisn, {
              nisn: s.nisn,
              nama: s.nama,
              nomor_absen: s.nomorAbsen,
              status: s.status
            }]))
          };
          try {
            await fetch(`${FIREBASE_BASE}/sekolah/${SCHOOL_ID}/absensi/${this.selectedYear}/${this.selectedDate}/${this.selectedClass}/${roleKey}.json`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            alert('Absensi berhasil disimpan!');
          } catch(e) {
            alert('Gagal menyimpan absensi.');
          } finally {
            this.saving = false;
          }
        },

        async loadBooks() {
          this.booksLoading = true;
          try {
            const res = await fetch('https://api.buku.cloudapp.web.id/api/catalogue/getPenggerakTextBooks?limit=1000');
            const json = await res.json();
            if (json && json.results) {
              this.books = json.results;
            }
          } catch(e) {
            this.books = [];
          } finally {
            this.booksLoading = false;
          }
        },

        get bookLevels() {
          return [...new Set(this.books.map(b => b.level).filter(Boolean))].sort();
        },

        get filteredBooks() {
          return this.books.filter(b => {
            const matchLvl = !this.selectedLevel || b.level === this.selectedLevel;
            const q = this.bookSearch.toLowerCase();
            const matchQ = !q || (b.title && b.title.toLowerCase().includes(q)) || (b.writer && b.writer.toLowerCase().includes(q)) || (b.subject && b.subject.toLowerCase().includes(q));
            return matchLvl && matchQ;
          });
        }
      };
    }
  </script>
</body>
</html>
